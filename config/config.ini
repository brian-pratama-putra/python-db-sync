[oracle_source]
v_host=localhost
v_port=1521
v_service_name=ORCL
v_username=hr
v_password=your_oracle_password
v_encoding=UTF-8

[postgres_target]
v_host=localhost
v_port=5432
v_database=target_db
v_username=postgres
v_password=your_postgres_password
v_schema=public

[sync_settings]
v_batch_size=1000
v_max_retries=3
v_retry_delay=5
v_timeout_seconds=300
v_parallel_workers=4
v_checkpoint_enabled=true
v_validation_enabled=true

[email_notification]
v_smtp_server=smtp.gmail.com
v_smtp_port=587
v_email_from=db-sync@company.com
v_email_to=admin@company.com,dba@company.com
v_email_password=your_app_password
v_send_success_email=false
v_send_error_email=true

[logging]
v_log_level=INFO
v_log_file=/opt/python-db-sync/logs/sync.log
v_log_max_size=10485760
v_log_backup_count=5
v_log_format=%(asctime)s - %(name)s - %(levelname)s - %(message)s